name: Supabase Keep-Alive

on:
  schedule:
    # Run every 2 days at 06:00 UTC to guarantee database activity well within the 7-day window
    - cron: '0 6 */2 * *'
  workflow_dispatch:
    inputs:
      log_message:
        description: 'Reason for manual ping'
        required: false
        default: 'Manual keep-alive write'
  push:
    paths:
      - '.github/workflows/keep_alive.yml'

# Allow workflow to commit heartbeat to prevent GitHub 60-day inactivity rule
permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Perform Database Write to Keep-Alive Table
        run: |
          echo "Trigger reason: ${{ github.event.inputs.log_message || 'Scheduled/Push trigger' }}"
          
          # 1. Attempt an actual database write (UPSERT) to the dedicated keep_alive table
          # This forces PostgreSQL WAL logging and transaction commits which Supabase monitors for activity
          WRITE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://khbjccryqlhzbcbxztbb.supabase.co/rest/v1/keep_alive" \
            -H "apikey: sb_publishable_FINud7LWZen4GjZT6xzvtg_s2AjKQMg" \
            -H "Authorization: Bearer sb_publishable_FINud7LWZen4GjZT6xzvtg_s2AjKQMg" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d '{"id": 1, "last_ping": "now()"}')
          
          echo "Supabase keep_alive write HTTP status: $WRITE_STATUS"

          # 2. Fallback GET query
          GET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://khbjccryqlhzbcbxztbb.supabase.co/rest/v1/firm_settings?select=id" \
            -H "apikey: sb_publishable_FINud7LWZen4GjZT6xzvtg_s2AjKQMg" \
            -H "Authorization: Bearer sb_publishable_FINud7LWZen4GjZT6xzvtg_s2AjKQMg")
          
          echo "Supabase fallback GET HTTP status: $GET_STATUS"

          if [ "$WRITE_STATUS" -ge 200 ] && [ "$WRITE_STATUS" -lt 400 ]; then
            echo "SUCCESS: Database write committed to keep_alive table. Supabase activity counter reset."
          elif [ "$GET_STATUS" -ge 200 ] && [ "$GET_STATUS" -lt 400 ]; then
            echo "NOTICE: Read query succeeded ($GET_STATUS), but keep_alive write returned $WRITE_STATUS (make sure keep_alive table is created in Supabase SQL editor)."
          else
            echo "WARNING: Both write and read requests failed."
          fi

      - name: Monthly Heartbeat (Prevent GitHub 60-Day Inactivity Rule)
        run: |
          HEARTBEAT_FILE=".github/heartbeat.txt"
          CURRENT_TIME=$(date +%s)
          NEED_COMMIT=false

          if [ ! -f "$HEARTBEAT_FILE" ]; then
            NEED_COMMIT=true
          else
            LAST_MODIFIED=$(git log -1 --format="%ct" -- "$HEARTBEAT_FILE" 2>/dev/null || echo 0)
            DAYS_PASSED=$(( (CURRENT_TIME - LAST_MODIFIED) / 86400 ))
            echo "Days since last heartbeat commit: $DAYS_PASSED"
            if [ "$DAYS_PASSED" -ge 25 ]; then
              NEED_COMMIT=true
            fi
          fi

          if [ "$NEED_COMMIT" = true ]; then
            echo "Updating heartbeat to keep GitHub repository active..."
            echo "Repository Heartbeat Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > "$HEARTBEAT_FILE"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$HEARTBEAT_FILE"
            git commit -m "Auto-heartbeat to keep GitHub Actions active [skip ci]" || true
            git push || true
            echo "Heartbeat check completed."
          else
            echo "Heartbeat is fresh. No commit needed today."
          fi
