name: Supabase Keep-Alive

on:
  schedule:
    # Run every 3 days at 06:00 UTC to keep the Supabase database awake (inactivity pauses after 7 days)
    - cron: '0 6 */3 * *'
  workflow_dispatch:
    inputs:
      log_message:
        description: 'Reason for manual ping'
        required: false
        default: 'Manual keep-alive ping'
  push:
    paths:
      - '.github/workflows/keep_alive.yml'

# Allow workflow to commit heartbeat to prevent GitHub 60-day inactivity rule
permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Supabase Database
        run: |
          echo "Trigger reason: ${{ github.event.inputs.log_message || 'Scheduled/Push trigger' }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "https://khbjccryqlhzbcbxztbb.supabase.co/rest/v1/firm_settings?select=id" \
            -H "apikey: sb_publishable_FINud7LWZen4GjZT6xzvtg_s2AjKQMg" \
            -H "Authorization: Bearer sb_publishable_FINud7LWZen4GjZT6xzvtg_s2AjKQMg")
          echo "Supabase HTTP status response: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Supabase successfully pinged. Inactivity counter reset."
          else
            echo "Supabase ping returned HTTP status $STATUS"
          fi

      - name: Monthly Heartbeat (Prevent GitHub 60-Day Inactivity Rule)
        run: |
          HEARTBEAT_FILE=".github/heartbeat.txt"
          CURRENT_TIME=$(date +%s)
          NEED_COMMIT=false

          if [ ! -f "$HEARTBEAT_FILE" ]; then
            NEED_COMMIT=true
          else
            LAST_MODIFIED=$(git log -1 --format="%ct" -- "$HEARTBEAT_FILE" 2>/dev/null || echo 0)
            DAYS_PASSED=$(( (CURRENT_TIME - LAST_MODIFIED) / 86400 ))
            echo "Days since last heartbeat commit: $DAYS_PASSED"
            if [ "$DAYS_PASSED" -ge 25 ]; then
              NEED_COMMIT=true
            fi
          fi

          if [ "$NEED_COMMIT" = true ]; then
            echo "Updating heartbeat to keep GitHub repository active..."
            echo "Repository Heartbeat Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > "$HEARTBEAT_FILE"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$HEARTBEAT_FILE"
            git commit -m "Auto-heartbeat to keep GitHub Actions active [skip ci]" || true
            git push || true
            echo "Heartbeat check completed."
          else
            echo "Heartbeat is fresh. No commit needed today."
          fi
